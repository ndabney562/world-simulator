[workspace]
resolver = "3"
members = [
    "crates/ws-cli",
    "crates/ws-ffi",
    "crates/ws-ecs",
    "crates/ws-events",
    "crates/ws-math",
    "crates/ws-life",
    "crates/ws-persist",
    "crates/ws-rng",
    "crates/ws-sim",
    "crates/ws-time",
    "crates/ws-world",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
publish = false

# Lints shared by every crate (each crate opts in with `[lints] workspace = true`).
# CI runs clippy with `-D warnings`, so every warning below fails the build.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Backed by `clippy.toml`: no wall-clock reads in simulation crates.
disallowed_methods = "deny"

[profile.dev]
# Tests and local runs are optimised: the suite is long integer simulation
# loops, and unoptimised it took 845 s instead of 119 s (#140). Debug
# assertions and overflow checks stay on (dev defaults), so behaviour is the
# same as before; only speed and debugger stepping change.
opt-level = 2

[profile.release]
# Integer overflow panics in every profile, so release builds cannot
# silently wrap where debug builds would stop (determinism policy).
overflow-checks = true
