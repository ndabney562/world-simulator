[package]
name = "ws-ffi"
version = "0.1.0"
description = "Versioned C boundary for the World Simulator Unity front end."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
ws-sim = { path = "../ws-sim" }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "snapshot"
harness = false

[lints]
workspace = true
