[package]
name = "ws-sim"
version = "0.1.0"
description = "World Simulator simulation core: the world, its clock, and its tick loop."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ws-rng = { path = "../ws-rng" }
ws-time = { path = "../ws-time" }
ws-world = { path = "../ws-world" }

[dev-dependencies]
# Benchmark harness (Apache-2.0 OR MIT), dev-only; default features (plots,
# rayon) off.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
ws-ecs = { path = "../ws-ecs" }

[[bench]]
name = "step"
harness = false

[lints]
workspace = true
