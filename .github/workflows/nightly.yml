name: Nightly LOD tests

on:
  push:
    branches: [codex/29-nightly-validation]
  schedule:
    # Off the hour to avoid the busiest scheduled-workflow period (UTC).
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-lod-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  lod:
    name: Long-running LOD tests
    runs-on: ubuntu-latest
    # Provisional ceiling, not a measured budget; calibrate after the first run.
    timeout-minutes: 350
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Run ignored LOD tests (release)
        run: cargo test --release --locked -p ws-world --test lod -- --ignored
