name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: Docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links and ADR index
        run: python3 scripts/check_docs.py

  rust:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Detect Rust workspace
        id: detect
        working-directory: .
        shell: bash
        run: |
          if [ -f core/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Rust checks not run::core/Cargo.toml does not exist yet. TP-001 creates the workspace and removes this skip."
          fi
      - name: Install Rust toolchain
        if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Format
        if: steps.detect.outputs.present == 'true'
        run: cargo fmt --all --check
      - name: Clippy
        if: steps.detect.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: cargo build --workspace --all-targets --locked
      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: cargo test --workspace --locked
