name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: Docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links and ADR index
        run: python3 scripts/check_docs.py

  unity:
    name: Unity project (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the Unity project files
        run: python3 scripts/check_unity_project.py
      - name: Unity check script tests
        working-directory: scripts
        run: python3 -m unittest -v test_check_unity_project

  rust:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: CLI Tier 2 replay
        shell: bash
        run: |
          journal="$RUNNER_TEMP/world-simulator-${{ matrix.os }}.wsjr"
          cargo run --locked -p ws-cli -- run --seed 42 --ticks 10000 --journal "$journal" --hash-every 1000 --script crates/ws-cli/tests/fixtures/ci-commands.txt
          cargo run --locked -p ws-cli -- replay --journal "$journal"
      - name: Dependency direction
        run: python3 ../scripts/check_core_deps.py
      - name: Dependency check script tests
        working-directory: .
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
