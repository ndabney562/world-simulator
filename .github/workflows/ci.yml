name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  browser-boundary:
    name: Browser boundary contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fatal-trap quarantine and browser-storage acknowledgment
        run: node --test tests/web/page.test.cjs
      - name: Release harness syntax (does not run Unity)
        run: |
          node --check tests/web/release/compatibility.cjs
          node --check tests/web/release/recovery.cjs
          node --check tests/web/release/performance.cjs
          python3 -c 'import ast; from pathlib import Path; [ast.parse(p.read_text()) for p in Path("tests/web/release").glob("*.py")]'
      - name: Full-player manifest tests
        run: python3 -m unittest discover -s scripts -p 'test_web_build_manifest.py'

  docs:
    name: Docs consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check links, ADR index and version claims
        run: python3 scripts/check_docs.py
      - name: Docs check tests
        working-directory: scripts
        run: python3 -m unittest -v test_check_docs
      - name: Vertical Slice block extract regenerates from its raw snapshot
        run: python3 scripts/vs_block_extract.py check
      - name: Vertical Slice block extract tests
        working-directory: scripts
        run: python3 -m unittest -v test_vs_block_extract

  unity:
    name: Unity project (static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the Unity project files
        run: python3 scripts/check_unity_project.py
      - name: Unity check script tests
        working-directory: scripts
        run: python3 -m unittest -v test_check_unity_project

  rust:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # os retains the historical check identity; runner selects the actual image.
        # Apple Silicon native coverage is mandatory locally; see ci-runner-fallback-proposal.md.
        os: [ubuntu-latest, macos-15, ubuntu-24.04-arm]
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          - os: macos-15
            runner: macos-15-intel
          - os: ubuntu-24.04-arm
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - name: Verify Intel Mac image
        if: matrix.runner == 'macos-15-intel'
        shell: bash
        run: |
          sw_vers
          test "$(uname -m)" = x86_64
          test "$(sw_vers -productVersion | cut -d . -f 1)" = 15
      - name: Verify ARM Linux image
        if: matrix.runner == 'ubuntu-24.04-arm'
        shell: bash
        run: |
          uname -a
          test "$(uname -m)" = aarch64
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustc --version
          cargo --version
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Native ABI C consumer
        shell: bash
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Icrates/ws-ffi/include \
            crates/ws-ffi/tests/abi-v9-smoke.c -Ltarget/debug -lws_ffi \
            -Wl,-rpath,"$PWD/target/debug" -o "$RUNNER_TEMP/worldsim-abi-smoke"
          "$RUNNER_TEMP/worldsim-abi-smoke"
      - name: CLI Tier 2 replay
        shell: bash
        run: |
          journal="$RUNNER_TEMP/world-simulator-${{ matrix.os }}.wsjr"
          cargo run --locked -p ws-cli -- run --seed 42 --ticks 10000 --journal "$journal" --hash-every 1000 --script crates/ws-cli/tests/fixtures/ci-commands.txt
          cargo run --locked -p ws-cli -- replay --journal "$journal"
      - name: CLI save and load
        shell: bash
        run: |
          save="$RUNNER_TEMP/world-simulator-${{ matrix.os }}.wssave"
          cargo run --locked -p ws-cli -- save --seed 42 --ticks 2000 --hash-every 1000 --script crates/ws-cli/tests/fixtures/ci-commands.txt --out "$save"
          cargo run --locked -p ws-cli -- load --file "$save" --ticks 500 --hash-every 250
          slice_save="$RUNNER_TEMP/slice-${{ matrix.os }}.wssave"
          cargo run --locked -p ws-cli -- save --slice --seed 42 --ticks 200 --hash-every 100 --out "$slice_save"
          cargo run --locked -p ws-cli -- load --file "$slice_save" --ticks 50 --hash-every 25
      - name: Dependency direction
        run: python3 ../scripts/check_core_deps.py
      - name: Dependency check script tests
        working-directory: .
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  ffi:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            check: Native bridge and header
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Intel Mac image
        if: matrix.runner == 'macos-15-intel'
        shell: bash
        run: |
          sw_vers
          test "$(uname -m)" = x86_64
          test "$(sw_vers -productVersion | cut -d . -f 1)" = 15
      - name: Install pinned Rust and iOS target
        working-directory: core
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal
          rustup target add --toolchain "$channel" aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install pinned header generator
        working-directory: core
        run: cargo install cbindgen --version 0.29.2 --locked
      - name: Check generated C header
        run: scripts/check-ffi-header.sh
      - name: Build iOS static library
        working-directory: core
        run: cargo build --release --locked -p ws-ffi --target aarch64-apple-ios
